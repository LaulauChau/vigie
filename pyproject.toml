[project]
name = "vigie"
version = "0.1.0"
description = "Weekly Slack digest of AI-practice picks, scored by a local Ollama LLM"
readme = "README.md"
authors = [
    { name = "Laurent Chau", email = "laurent.chau@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "trafilatura>=2.3.1",
    "typer>=0.27.3",
    "youtube-transcript-api>=1.2.4",
]

[project.scripts]
vigie = "vigie.cli:app"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["feedparser"]
ignore_missing_imports = true
